  <rect x="20" y="16" width="24" height="36" rx="5" stroke="#c5ece6" stroke-width="1"/>
  <rect x="24" y="23" width="16" height="2" rx="1" fill="#2aada0" opacity=".5"/>
  <rect x="24" y="29" width="12" height="2" rx="1" fill="#2aada0" opacity=".35"/>
