<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaperSwipe · 内测登录</title>
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#11131a;background:#e7e9ed;color-scheme:light;--accent:#6657e8;--muted:#626776}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #6657e8;outline-offset:4px}main{position:relative;isolation:isolate;overflow:hidden;width:min(100%,430px);min-height:100dvh;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 26px calc(24px + env(safe-area-inset-bottom));background:#f4f5f7;box-shadow:0 0 65px #181b2324;display:flex;flex-direction:column}main:before{content:"";position:absolute;z-index:-1;inset:0 0 auto;height:450px;background:radial-gradient(ellipse at 85% 0%,#c8bcff99,transparent 65%),radial-gradient(ellipse at 0% 45%,#b5e8e466,transparent 65%);pointer-events:none}.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.6px}.brand svg{width:28px;height:28px;color:var(--accent)}.beta{margin-left:auto;font-size:11px;letter-spacing:0;font-weight:600;color:#503bd5;background:#ebe8ff;padding:6px 10px;border-radius:20px}.intro{margin-top:46px}.paper-mark{position:relative;width:76px;height:83px;margin-bottom:26px}.paper-mark:before{content:"";position:absolute;inset:7px 10px 0 0;border-radius:13px;background:#d8d1fb;transform:rotate(-12deg)}.paper-mark svg{position:relative;width:64px;height:78px}h1{font-size:34px;line-height:1.32;letter-spacing:-1.3px;margin:0 0 14px;font-weight:800}.intro p{font-size:14px;line-height:1.8;color:var(--muted);margin:0}form{margin-top:32px}label{font-size:14px;font-weight:650;display:block;margin-bottom:10px}.input-wrap{display:flex;align-items:center;border:1px solid #ccd0db;border-radius:16px;background:#fff}.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #6657e81a}.input-wrap:has([aria-invalid="true"]){border-color:#b42335}input{width:100%;min-width:0;border:0;background:transparent;padding:18px 0 18px 16px;font-size:16px;outline:none;color:#11131a}input::placeholder{color:#797f8b;font-size:14px}#reveal{flex:none;background:none;border:0;color:#503bd5;padding:12px;margin-right:4px;border-radius:10px;font-size:13px;min-height:44px}.hint{margin:10px 0 0;font-size:12px;line-height:1.7;color:var(--muted)}#submit{width:100%;min-height:54px;margin-top:24px;border:0;border-radius:18px;background:var(--accent);color:white;font-size:16px;font-weight:650;box-shadow:0 7px 18px #6657e82b;transition:background .15s,transform .15s}#submit:hover{background:#503bd5}#submit:active{transform:scale(.985)}#submit:disabled{background:#7769db;cursor:wait}#error{font-size:13px;line-height:1.65;color:#a31e30;margin:12px 0 0}#error:empty{display:none}.support{font-size:12px;color:var(--muted);text-align:center;margin:20px 0 32px;line-height:1.8}.privacy{margin-top:auto;border-top:1px solid #dfe2e8;padding-top:18px;color:var(--muted);font-size:12px;line-height:1.8}summary{cursor:pointer;min-height:32px;color:#4b5161;font-weight:600}details p{margin:8px 0 12px}.footnote{margin:6px 0 0;font-size:11px;color:var(--muted)}@media(max-width:360px){main{padding-inline:20px}.intro{margin-top:30px}h1{font-size:30px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="icon" href="/assets/paperswipe-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/paperswipe-logo.png">
<style>.brand .product-logo{width:32px;height:32px;border-radius:8px}.paper-mark:before{display:none}.paper-mark .product-logo{width:78px;height:78px;border-radius:18px}</style>
<main>
<style>
.input-wrap{transition:border-color 180ms ease,box-shadow 180ms ease}
#submit,#reveal,summary{transition:transform 180ms cubic-bezier(.22,1,.36,1),background-color 180ms ease,box-shadow 180ms ease}
#submit:not(:disabled):active{transform:scale(.96);box-shadow:0 2px 8px #6657e826}
#reveal:active{transform:scale(.9);background:#ebe8ff}
summary:active{transform:translateX(3px)}
#error:not(:empty){animation:login-feedback 220ms ease-out}
details[open] p{animation:login-feedback 220ms ease-out}
@keyframes login-feedback{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<header class="brand"><img class="product-logo" src="/assets/paperswipe-logo.png" alt=""><span>PaperSwipe</span><span class="beta">邀请制内测</span></header>
<section class="intro" aria-labelledby="welcome"><div class="paper-mark" aria-hidden="true"><img class="product-logo" src="/assets/paperswipe-logo.png" alt=""></div><h1 id="welcome">找到值得读的论文。</h1><p>从一篇好论文开始。<br>输入专属邀请码，开启你的阅读探索。</p></section>
<form id="login"><label for="token">邀请码</label><div class="input-wrap"><input id="token" name="token" type="password" required autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="粘贴团队发给你的邀请码" aria-describedby="token-hint error"><button id="reveal" type="button" aria-label="显示邀请码" aria-pressed="false">显示</button></div><p class="hint" id="token-hint">每个邀请码对应独立文献库，请勿转发。</p><button id="submit" type="submit">进入 PaperSwipe</button><p id="error" role="alert"></p></form>
<p class="support">还没有邀请码？请联系邀请你加入内测的团队成员。</p>
<footer class="privacy"><details><summary>你的数据如何使用</summary><p>我们保存你的收藏和检索历史。检索词会发送至论文数据源；启用模型后，研究描述和论文摘要会发送至模型服务。请勿输入未公开的敏感研究内容。需要删除数据或反馈问题，请联系发放邀请的团队成员。</p></details><p class="footnote">内测版本持续改进中，欢迎分享你的使用感受。</p></footer></main>
<script>
const form=document.querySelector('#login'),token=document.querySelector('#token'),button=document.querySelector('#submit'),error=document.querySelector('#error'),reveal=document.querySelector('#reveal');
let pending=false;
reveal.addEventListener('click',()=>{const visible=token.type==='password';token.type=visible?'text':'password';reveal.textContent=visible?'隐藏':'显示';reveal.setAttribute('aria-label',visible?'隐藏邀请码':'显示邀请码');reveal.setAttribute('aria-pressed',String(visible));});
token.addEventListener('input',()=>{token.removeAttribute('aria-invalid');error.textContent='';});
form.addEventListener('submit',async e=>{
 e.preventDefault();if(pending)return;const value=token.value.trim();
 if(!/^[a-f0-9]{64}$/i.test(value)){error.textContent='请粘贴完整的 64 位邀请码，不要包含前面的说明文字。';token.setAttribute('aria-invalid','true');token.focus();return;}
 pending=true;button.disabled=true;token.readOnly=true;form.setAttribute('aria-busy','true');button.textContent='正在验证…';error.textContent='';
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:value}),signal:controller.signal});
 if(!r.ok){token.setAttribute('aria-invalid','true');throw Error(r.status===429?'尝试次数较多，请稍后再试。':r.status===401||r.status===403?'邀请码无效或已撤销，请核对后重试，或联系邀请人。':'暂时无法登录，请稍后重试。');}location.replace('/');
 }catch(e){error.textContent=e.name==='AbortError'?'连接超时，请确认连接正常后重试。':e instanceof TypeError?'无法连接服务，请检查网络或测试连接后重试。':e.message;
 }finally{clearTimeout(timeout);pending=false;button.disabled=false;token.readOnly=false;form.removeAttribute('aria-busy');button.textContent='进入 PaperSwipe';}
});
</script>
</html>
