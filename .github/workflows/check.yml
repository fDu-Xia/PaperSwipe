name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.js && node --check web/bootstrap.js
      - run: docker build -t paperswipe-beta:test .
